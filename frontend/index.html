<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursorgame</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #e6e0d2;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain; /* Or 'cover' if you want zero bars ever */
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
